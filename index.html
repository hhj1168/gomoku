<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="3D国际五子棋 - 支持人人对战和人机对战，精美3D界面">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="五子棋">
    <meta name="format-detection" content="telephone=no">
    <title>3D 国际五子棋</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="main-container">
        <div class="game-info">
            <h1>国际五子棋</h1>

            <div class="mode-selection" id="mode-selection">
                <h3>选择游戏模式</h3>
                <button class="mode-btn selected" data-mode="pvp">
                    <span class="icon">👥</span>
                    <span>人人对战</span>
                </button>
                <button class="mode-btn" data-mode="pve">
                    <span class="icon">🤖</span>
                    <span>人机对战</span>
                </button>

                <div id="difficulty-panel" class="hidden">
                    <h3>选择难度</h3>
                    <button class="difficulty-btn selected" data-difficulty="normal">
                        <span class="icon">⭐</span>
                        <span>普通</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="master">
                        <span class="icon">👑</span>
                        <span>大师</span>
                    </button>
                </div>

                <button id="start-btn" class="btn-3d start-btn">开始游戏</button>
            </div>

            <div class="status-panel hidden" id="game-panel">
                <div class="current-turn">
                    <span id="turn-text">当前回合: </span>
                    <div id="turn-indicator" class="piece black"></div>
                </div>
                <div id="winner-display" class="hidden"></div>
                <button id="restart-btn" class="btn-3d">重新开始</button>
            </div>
        </div>

        <div class="scene">
            <div class="board-container">
                <div class="board-wood">
                    <div class="grid-lines" id="grid-layer">
                        <!-- Grid lines will be generated by JS -->
                    </div>
                    <div class="pieces-layer" id="board">
                        <!-- Pieces will be placed here -->
                    </div>
                </div>
                <div class="board-side front"></div>
                <div class="board-side left"></div>
                <div class="board-side right"></div>
                <div class="board-side back"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
